# Sites used to answer "what's on in Denver tonight", with what each one gave us.
# URLs may contain strftime tokens (%Y, %m, %d); scripts/list_sources.rb fills them in.
#
# fetch:  ok       page loads with a plain fetch and carries dated listings
#         partial  loads, but dates lack a year, or the schedule is incomplete/stale
#         blocked  403/404/empty/JS-rendered; needs a browser or a different source
# Last verified: 2026-11-19

concert_listings:
  - name: do303 live music by date
    url: https://do303.com/events/live-music/%Y/%m/%d
    fetch: ok
    notes: Best single page for one night. Aggregator, so confirm headliners at the venue.
  - name: 303.show month view
    url: https://303.show/month/%Y-%m
    fetch: ok
    notes: Widest small-venue coverage (dive bars, DIY rooms). Aggregator; includes non-music events.
  - name: Z2 Entertainment
    url: https://z2ent.com/events
    fetch: ok
    notes: Promoter page covering Fox Theatre, Boulder Theater and Aggie Theatre, whose own sites 404.
  - name: Live Nation artist pages
    url: https://www.livenation.com
    fetch: ok
    notes: Artist event pages load and confirmed a Summit Music Hall show. Venue pages are JS-rendered.
  - name: JamBase Denver area
    url: https://www.jambase.com/concerts/us-co/denver
    fetch: blocked
    notes: Loads but returns "no concerts match"; useful through search snippets only.
  - name: Denver Drop month page
    url: https://denverdrop.com/months/denver-events-november-2026
    fetch: partial
    notes: Seen via search snippets only; month slug changes.

